[project]
name = "00-job-board-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "azure-servicebus>=7.15",
    "django>=5.2,<5.3",
    "django-filter>=26.2",
    "django-prometheus>=2.5",
    "django-storages[azure,s3]>=1.14.6",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "python-json-logger>=3.1",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "moto[s3,sqs]>=5.2.5",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--cov --cov-report=term-missing --cov-fail-under=80"
# django-storages' AzureStorage calls datetime.utcnow() (deprecated in Python 3.12). Library code, not ours:
# hide only this message from only that module, so any other warning still shows. Remove when django-storages fixes it.
filterwarnings = [
    "ignore:datetime.datetime.utcnow:DeprecationWarning:storages.backends.azure_storage",
]

[tool.coverage.run]
source = ["jobs", "cloud", "worker", "config"]
omit = ["*/migrations/*", "*/tests/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
exclude_also = ['if __name__ == .__main__.:']
