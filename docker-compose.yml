services:
  db:
    image: postgres:17
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:2026.10.4
    ports:
      - "127.0.0.1:4566:4566"
    env_file: .env.localstack
    environment:
      - SERVICES=s3,sqs
      - S3_SKIP_SIGNATURE_VALIDATION=0
      - AWS_STORAGE_BUCKET_NAME=${AWS_STORAGE_BUCKET_NAME:?set AWS_STORAGE_BUCKET_NAME in .env}
      - SQS_QUEUE_NAME=${SQS_QUEUE_NAME:?set SQS_QUEUE_NAME in .env}
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3api head-bucket --bucket $${AWS_STORAGE_BUCKET_NAME} && awslocal sqs get-queue-url --queue-name $${SQS_QUEUE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
  
  worker:
    build: .
    command: ["python", "-m", "worker.run_worker"]
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
    stop_grace_period: 30s
    restart: unless-stopped

  
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    ports:
      - "8006:8006"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      localstack:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  
  


volumes:
  pgdata: